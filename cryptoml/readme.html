<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2425 Aqtis ML Project</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/markdown-it/dist/markdown-it.min.js"></script>
</head>
<body>

<div class="container" id="markdown-content"></div>

<script>
    fetch('readme.md')
        .then(response => response.text())
        .then(markdown => {
            const md = window.markdownit({html: true});
            document.getElementById('markdown-content').innerHTML = md.render(markdown);
        })
        .catch(error => {
            document.getElementById('markdown-content').innerHTML = '<p>Error loading markdown file.</p>';
            console.error('Error:', error);
        });
</script>

</body>
</html>
