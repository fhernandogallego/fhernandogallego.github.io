name: Update Google Scholar metrics

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check scholarly==1.7.11 requests==2.32.5
      - name: Refresh Scholar data
        env:
          SCHOLAR_AUTHOR_ID: 89e5aoQAAAAJ
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/update_scholar.py
      - name: Commit updated public metrics
        run: |
          if git diff --quiet; then
            echo "No public metrics changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar.json data/scholar-history.jsonl index.html es/index.html llms.txt
          git commit -m "Update Google Scholar metrics"
          git pull --rebase origin main
          git push origin HEAD:main
