name: Deploy academic website to Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update Google Scholar metrics"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Wait for Pages artifact
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length'); then
              if [ "$count" -eq 1 ]; then
                echo "Pages artifact is available."
                exit 0
              fi
              if [ "$count" -gt 1 ]; then
                echo "::error::Multiple Pages artifacts found; refusing an ambiguous deployment."
                exit 1
              fi
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Pages artifact not yet available (attempt $attempt/6); checking again in 5 seconds."
              sleep 5
            fi
          done
          echo "::error::Pages artifact did not become available after six checks."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
